# Tiny Tapeout project information (Wokwi project)
project:
  wokwi_id: "476711427277175809" # Set this to the ID of your Wokwi project (the number from the project's URL)
  title: "LUIS ARCADE" # Project title
  author: "Luis Lasso" # Your name
  discord: "" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "16 functions on one 7-segment display: text sign, dice and coin, counters and spinners, 3-digit combination safe" # One line description of what your project does
  language: "Wokwi" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 128 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "PAUSE (sign, counter) / ROLL (dice) / digit bit 0 (safe)"
  ui[1]: "DIRECTION 0=up 1=down / digit bit 1 (safe)"
  ui[2]: "SPEED bit 0 / digit bit 2 (safe)"
  ui[3]: "SPEED bit 1 / digit bit 3 (safe)"
  ui[4]: "VARIANT bit 0 / ENTER (safe)"
  ui[5]: "VARIANT bit 1 / CLEAR (safe)"
  ui[6]: "MODE bit 0"
  ui[7]: "MODE bit 1 (00 sign, 01 dice, 10 counter, 11 safe)"

  # Outputs
  uo[0]: "segment a"
  uo[1]: "segment b"
  uo[2]: "segment c"
  uo[3]: "segment d"
  uo[4]: "segment e"
  uo[5]: "segment f"
  uo[6]: "segment g"
  uo[7]: "decimal point (dp)"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
