  title: "LUIS Secret Safe" # Project title
  author: "Luis Lasso" # Your name
  discord: "" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "8-bit code safe that spells L-U-I-S on the 7-segment display when opened" # One line description of what your project does
