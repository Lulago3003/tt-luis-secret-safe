  ui[4]: "code bit 4"
  ui[5]: "code bit 5"
  ui[6]: "code bit 6"
  ui[7]: "code bit 7"

  # Outputs
  uo[0]: "segment A"
  uo[1]: "segment B"
  uo[2]: "segment C"
  uo[3]: "segment D"
  uo[4]: "segment E"
  uo[5]: "segment F"
  uo[6]: "segment G"
